<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing App - Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .glass-card {
      background: rgba(33, 37, 41, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: scale(1.01);
      box-shadow: 0 0 10px rgb(255, 255, 255);
    }
    .rounded-pill-input {
      border-radius: 2rem;
    }
    .shrink-mobile {
      top: 0;
      z-index: 2;
    }
     @media (max-width: 576px) {
    .shrink-mobile {
      transform: scale(0.7);
      font-size: 0.85rem;
      top: auto;
      bottom: 0;
    }
  }
  </style>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100dvh;">
    <div class="container p-4 rounded-4 glass-card w-100 mx-2">
        <div id="counter" class="bg-light text-black py-1 rounded-circle fs-4 position-absolute start-0 top-0 ms-4 mt-4 shadow px-3">0</div>
        <h2 class="text-center mb-4">🧾 Billing App</h2>
        <div id="total" class="bg-light text-black py-1 rounded-5 fs-4 position-absolute end-0 me-0 me-sm-4 mt-4 shadow px-3 shrink-mobile overflow-auto" style="max-width: 200px; scrollbar-width: none;">$0.00</div>
        <div id="productContainer" class="d-flex flex-column gap-3 p-3 overflow-y-auto" style="max-height: 60vh; scrollbar-width: none;"></div>
    </div>

    <button class="btn btn-light rounded-circle fs-4 position-absolute end-0 bottom-0 me-4 mb-4 shadow px-3" onclick="addProduct()">+</button>

    <template id="product-template">
        <div class="bg-secondary bg-gradient p-3 rounded-4 d-flex justify-content-between align-items-center product-card position-relative">
            <div class="bg-transparent text-black py-1 rounded-5 fs-4 position-absolute top-0 end-0 cursor-pointer user-select-none px-3" onclick="deleteProduct(this.parentElement)">×</div>

            <div class="d-flex gap-2 flex-wrap flex-grow-1">
                <input type="text" class="form-control rounded-pill-input border-0 text-center" placeholder="Name">
                <input type="number" class="Price form-control rounded-pill-input border-0 text-center" onchange="calculate(this.parentElement)" placeholder="Price">
                <input  type="number" class="Quantity form-control rounded-pill-input border-0 text-center" onchange="calculate(this.parentElement)" placeholder="Quantity">
            </div>
            <div class="ms-3 d-flex align-items-center gap-2">
                <span class="fw-bold">Price:</span>
                <div  class="result bg-light text-dark px-3 py-1 rounded-pill border border-danger fw-semibold overflow-x-auto" style="max-width: 100px; scrollbar-width: none;">$0</div>
            </div>
        </div>
    </template>

  <script>
    const container = document.getElementById("productContainer");
    const counter = document.getElementById("counter");
    const total = document.getElementById("total");

    function addProduct() {
        const template = document.getElementById("product-template");
        const clone = template.content.cloneNode(true);
        container.appendChild(clone);
        counter.innerText = parseInt(counter.innerText) + 1
    }

    function calculate(ele) {
      const result = ele.nextElementSibling.querySelector(".result");
      const price = ele.querySelector(".Price");
      const quantity = ele.querySelector(".Quantity");

      const priceValue = parseFloat(price.value) || 0;
      const quantityValue = parseInt(quantity.value) || 0;

      result.innerText = "$" + priceValue * quantityValue;

      
      calculateTotal();
    }

    function calculateTotal() {
      var tot = 0;
      [...container.children].forEach(element => {
        const resultText = element.lastElementChild.querySelector(".result")?.innerText || "0";
        const resultValue = parseFloat(resultText.replace("$", "")) || 0;
        tot += resultValue;
      });

      total.innerText = "$" + tot.toFixed(2);
    }

    function deleteProduct(ele) {
      
      counter.innerText = parseInt(counter.innerText) - 1;
      ele.remove();
      calculateTotal();
    }


  </script>

</body>
</html>
