<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark">
  <div class="container">
    
    <!-- Screen -->
    <div class="row px-2 px-md-0">
      <div class="col-12 bg-black rounded-3 mt-2 overflow-hidden" style="height: 20vh; min-height: 200px;">
        <div contenteditable="true" id="input" class="row p-2 text-white" style="height: 50%; font-size: 3rem; overflow-x: scroll; scrollbar-width: none;"></div>
        <div id="output" class="row p-2 text-white text-start" style="height: 50%; font-size: 3rem; overflow-x: scroll; scrollbar-width: none;"></div>
      </div>
    </div>

    <!-- Button Rows -->
    <div class="row mt-2">
      <div class="col-12">
        
        <!-- Row 1 -->
        <div class="row justify-content-center mt-3 gx-3">
          <div class="col-3 d-flex"><button class="btn w-100 btn-primary fs-4" style="height: 10vh;" onclick="buttonpress(this)">AC</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-warning fs-4" style="height: 10vh;" onclick="buttonpress(this)">(</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-warning fs-4" style="height: 10vh;" onclick="buttonpress(this)">)</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-success fs-4" style="height: 10vh;" onclick="buttonpress(this)">÷</button></div>
        </div>

        <!-- Row 2 -->
        <div class="row justify-content-center mt-3 gx-3">
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">7</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">8</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">9</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-success fs-4" style="height: 10vh;" onclick="buttonpress(this)">×</button></div>
        </div>

        <!-- Row 3 -->
        <div class="row justify-content-center mt-3 gx-3">
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">4</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">5</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">6</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-success fs-4" style="height: 10vh;" onclick="buttonpress(this)">+</button></div>
        </div>

        <!-- Row 4 -->
        <div class="row justify-content-center mt-3 gx-3">
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">1</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">2</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">3</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-success fs-4" style="height: 10vh;" onclick="buttonpress(this)">-</button></div>
        </div>

        <!-- Row 5 -->
        <div class="row justify-content-center mt-3 mb-4 gx-3">
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">0</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">.</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-danger fs-4" style="height: 10vh;" onclick="buttonpress(this)">&lt;</button></div>
          <div class="col-3 d-flex"><button class="btn w-100 btn-info fs-4" style="height: 10vh;" onclick="buttonpress(this)">=</button></div>
        </div>

      </div>
    </div>

  </div>
</body>
<script src="Source_Code.js"></script>
</html>
